<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order Processing with Amazon SQS</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 720px; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    fieldset { border: 1px solid #ccc; padding: 1rem; }
    input, button { font-size: 1rem; padding: .4rem; }
    .stats { display: flex; gap: 1rem; margin-top: 1.5rem; text-align: center; }
    .stat { flex: 1; border: 1px solid #ccc; padding: .8rem; }
    .stat .value { font-size: 2.4rem; font-weight: bold; }
    .stat .label { font-size: .8rem; color: #555; text-transform: uppercase; }
    .backlog .value { color: #c0392b; }
    #result { margin-top: .8rem; font-family: monospace; }
  </style>
</head>
<body>
  <h1>Order Processing with Amazon SQS</h1>

  <fieldset>
    <legend>Place an order</legend>
    Product: <input id="product" value="Laptop">
    Quantity: <input id="quantity" type="number" value="2" min="1" style="width:5rem">
    <button onclick="placeOrder()">Place order</button>
    <div id="result"></div>
  </fieldset>

  <div class="stats">
    <div class="stat"><div class="value" id="submitted">0</div><div class="label">Submitted here</div></div>
    <div class="stat backlog"><div class="value" id="waiting">0</div><div class="label">Waiting in queue</div></div>
    <div class="stat"><div class="value" id="in_progress">0</div><div class="label">Being processed</div></div>
    <div class="stat"><div class="value" id="processed">0</div><div class="label">Processed</div></div>
  </div>

  <script>
    // Send the order to the backend, which queues it and replies immediately.
    async function placeOrder() {
      const body = {
        product: document.getElementById("product").value,
        quantity: Number(document.getElementById("quantity").value)
      };
      const response = await fetch("/orders", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
      });
      const data = await response.json();
      document.getElementById("result").textContent =
        data.order_id ? `Queued as ${data.order_id}` : `Error: ${data.error}`;
      refresh();
    }

    // Poll the backend once a second so the queue depth visibly climbs while
    // the producers outpace the workers, and falls once a worker is added.
    async function refresh() {
      const stats = await (await fetch("/stats")).json();
      for (const key of ["submitted_here", "waiting", "in_progress", "processed"]) {
        const el = document.getElementById(key === "submitted_here" ? "submitted" : key);
        if (stats[key] !== undefined) el.textContent = stats[key];
      }
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
